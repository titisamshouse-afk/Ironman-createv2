name: Minecraft Fabric Test Server

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle build --no-daemon --no-configuration-cache

      - name: Download Fabric server launcher
        run: |
          mkdir -p minecraft-test/mods
          curl -fL --retry 5 --retry-all-errors "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.14/1.0.1/server/jar" -o /tmp/fabric-server-launch.jar
          mv /tmp/fabric-server-launch.jar minecraft-test/fabric-server-launch.jar
          test -s minecraft-test/fabric-server-launch.jar

      - name: Install Fabric API
        run: |
          find "$HOME/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api" -type f -name "fabric-api-*.jar" ! -name "*-sources.jar" -print -quit | xargs -r -I{} cp "{}" minecraft-test/mods/fabric-api.jar
          test -s minecraft-test/mods/fabric-api.jar

      - name: Install Iron Man mod
        run: |
          find build/libs -maxdepth 1 -type f -name "ironman-*.jar" ! -name "*-sources.jar" -print -quit | xargs -I{} cp "{}" minecraft-test/mods/ironman.jar
          test -s minecraft-test/mods/ironman.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > minecraft-test/eula.txt

      - name: Start test server
        working-directory: minecraft-test
        run: |
          test -s fabric-server-launch.jar
          java -Xmx1G -Xms512M -jar "$GITHUB_WORKSPACE/minecraft-test/fabric-server-launch.jar" nogui > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..60}; do
            if grep -q "Done (" server.log; then
              echo "Minecraft server started successfully."
              break
            fi

            if grep -qE "Mod resolution failed|Exception in server tick loop|Caused by: .*Mod" server.log; then
              echo "Minecraft server reported a mod-loading error:"
              tail -n 160 server.log
              exit 1
            fi

            sleep 2
          done

          if ! grep -q "Done (" server.log; then
            echo "Server did not finish starting."
            tail -n 160 server.log
            exit 1
          fi

      - name: Verify Iron Man mod loaded
        working-directory: minecraft-test
        run: |
          grep -i "ironman" server.log
          if grep -qiE "Mod resolution failed|Exception in server tick loop|Failed to load .*ironman" server.log; then
            echo "Iron Man mod/server loading failure detected."
            tail -n 200 server.log
            exit 1
          fi
          echo "Iron Man Fabric test passed."

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-fabric-test-log
          path: minecraft-test/server.log
          if-no-files-found: warn
